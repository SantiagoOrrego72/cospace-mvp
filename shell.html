<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>CoSpace · Reserva de espacios de coworking</title>
<style>
:root{--ink:#1C2321;--muted:#5F6B68;--line:#E2DED7;--bg:#F6F4F0;--card:#fff;--pri:#0F6B5C;--pri-d:#0A4F44;--pri-l:#E3F1EE;--red:#9B3B30;--red-l:#F3E3E1;--busy:#EFEDE9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:24px;margin:0 0 4px}h3{font-size:17px;margin:0 0 10px}h4{margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}.hidden{display:none!important}
.btn{border:0;border-radius:10px;padding:12px 20px;font-weight:600;transition:background .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--pri);color:#fff}.btn.primary:hover{background:var(--pri-d)}.btn.primary:disabled{background:#9DBDB6}
.btn.ghost{background:#fff;border:1.5px solid var(--line)}.btn.ghost:hover{border-color:#C9C3B9}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{padding:7px 14px;font-size:13.5px}.btn.block{width:100%}
.link{background:none;border:0;padding:0;color:var(--pri);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link.muted{color:var(--muted);font-weight:500;text-decoration:none}
:focus-visible{outline:3px solid #7FB8AC;outline-offset:2px}
.chip{display:inline-block;padding:4px 12px;border-radius:14px;font-size:12.5px;font-weight:600;background:var(--pri-l);color:var(--pri-d)}
.chip.free,.chip.activa{background:var(--pri-l);color:var(--pri-d)}.chip.busy,.chip.cancelada{background:var(--red-l);color:var(--red)}.chip.finalizada{background:var(--busy);color:var(--muted)}
/* auth */
.auth{display:grid;grid-template-columns:44% 1fr;min-height:100vh}
.auth aside{background:var(--pri);color:#fff;padding:48px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:700}
.mark{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--pri);color:#fff;font-weight:700}
.mark.light{background:#fff;color:var(--pri);width:38px;height:38px}
.pitch{margin-top:auto}.pitch h1{font-size:38px;line-height:1.15;color:#fff}.pitch p{color:#CFE6E1;font-size:17px;max-width:420px}
.stats{display:flex;gap:56px;margin:48px 0 8px}.stats b{display:block;font-size:28px}.stats span{color:#CFE6E1;font-size:13px}
.auth-main{display:grid;place-items:center;padding:40px}
.auth-form{width:100%;max-width:440px}.auth-form h2{font-size:30px}.auth-form>.muted{margin:0 0 22px}
.field{display:block;margin-bottom:14px}.field>span{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px}
.field input,.field select,.field textarea,.filters input,.filters select,.panel input[type=date],.report input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font:inherit}
.field input.invalid,.field select.invalid{border-color:var(--red)}
.err{display:block;color:var(--red);font-size:12.5px;font-style:normal;margin-top:4px;min-height:0}
.alert{background:var(--red-l);color:var(--red);padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:14px}
.demo{margin-top:26px;padding:14px;border:1px dashed #C9C3B9;border-radius:12px;font-size:13px}.demo b{display:block;margin-bottom:6px}
.demo-acc{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 0;color:var(--pri-d)}
/* top */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 40px;background:#fff;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;font-size:20px;font-weight:700;padding:0}
.top nav{display:flex;gap:6px;height:100%}
.nav-item{background:none;border:0;padding:0 16px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;height:100%}
.nav-item.active{color:var(--pri);font-weight:600;border-bottom-color:var(--pri)}
.user{display:flex;align-items:center;gap:10px;font-size:14px}.avatar{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--pri-l);color:var(--pri-d);font-weight:700;font-size:12.5px}
.page{max-width:1360px;margin:0 auto;padding:32px 40px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.crumbs{margin:0 0 14px;font-size:14px;color:var(--muted)}
/* catalog */
.filters{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-bottom:22px}
.chips,.quick{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:13.5px;font-weight:500}.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.filter-inputs{display:flex;gap:10px;align-items:center}.filter-inputs input,.filter-inputs select{width:auto;padding:9px 12px;font-size:14px}.filter-inputs input[type=search]{width:260px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:22px}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;transition:box-shadow .15s,transform .15s}
.card:hover{box-shadow:0 8px 24px rgba(28,35,33,.08);transform:translateY(-2px)}
.card-hit{position:absolute;inset:0;background:none;border:0;border-radius:14px;z-index:1}
.card .btn{position:relative;z-index:2}
.card-tag{position:absolute;top:24px;left:24px}.card-tag .chip{background:#fff}
.card-body{padding:12px 8px 4px}.card-body h3{margin:0}.card-body p{margin:2px 0 14px;font-size:14px}
.card-foot{display:flex;justify-content:space-between;align-items:center}.card-foot b{font-size:17px}
.photo{border-radius:10px;height:160px;display:grid;place-items:center}.photo svg{width:80px}
.photo.big{height:420px}.photo.big svg{width:120px}
.empty{background:#fff;border:1px dashed #C9C3B9;border-radius:14px;padding:48px;text-align:center}
/* detail */
.detail{display:grid;grid-template-columns:1.6fr 1fr;gap:36px}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.thumbs .photo{height:110px}
.info h1{font-size:32px}.desc{margin:18px 0}.services{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:14px}
.services li:before{content:"✓";display:inline-grid;place-items:center;width:18px;height:18px;margin-right:8px;border-radius:50%;background:var(--pri-l);color:var(--pri);font-size:11px;font-weight:700}
.price-box{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:22px}.price{font-size:28px}.price-box p{margin:4px 0 0}
/* reserve */
.reserve{display:grid;grid-template-columns:300px 1fr 360px;gap:20px;margin-top:20px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.panel .quick{margin:12px 0}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.slot{padding:12px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:500}
.slot:hover:not(:disabled){border-color:var(--pri)}
.slot.sel{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.slot.busy,.slot.past{background:var(--busy);border-color:var(--busy);color:#B0B5B3;text-decoration:line-through}
.legend{display:flex;gap:20px;margin-top:16px;font-size:13px;color:var(--muted)}.lg{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);margin-right:6px;vertical-align:-2px;background:#fff}.lg.sel{background:var(--pri);border-color:var(--pri)}.lg.busy{background:var(--busy)}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px}.row b{text-align:right}
.row.total{border-top:1px solid var(--line);margin:10px 0 16px;padding-top:16px;font-size:16px;font-weight:700}.row.total b{font-size:22px}
/* confirm */
.confirm{max-width:560px;margin:10px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px 44px;text-align:center}
.ok-icon{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--pri-l);color:var(--pri);display:grid;place-items:center;font-size:40px;font-weight:700}
.code{background:var(--pri-l);color:var(--pri-d);border-radius:12px;padding:14px;margin:22px 0 14px}.code span{display:block;font-size:13px}.code b{font-size:24px;letter-spacing:.02em}
.confirm .row{text-align:left}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
/* tables */
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin:20px 0}
.tab{background:none;border:0;padding:0 0 10px;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}.tab.on{color:var(--pri);font-weight:700;border-color:var(--pri)}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{background:var(--busy);text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:14px 18px}
td{padding:16px 18px;border-top:1px solid var(--line)}tr.dim td{color:var(--muted)}
.actions{display:flex;gap:8px;justify-content:flex-end}
/* admin */
.report{margin:24px 0 14px}.report .filter-inputs input{width:auto}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.kpis div{background:var(--bg);border-radius:12px;padding:14px 16px}.kpis b{display:block;font-size:22px;margin-top:2px}
.bar-row{display:grid;grid-template-columns:180px 1fr 60px 170px;gap:14px;align-items:center;padding:7px 0;font-size:14px}
.bar{height:12px;background:var(--busy);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.bar-row em{font-style:normal;color:var(--muted);font-size:13px}
.offline{background:var(--red-l);color:var(--red);padding:12px 20px;text-align:center;font-size:14px}
/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(28,35,33,.45);display:grid;place-items:center;z-index:20;padding:20px}
.modal{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal textarea{resize:vertical}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;transition:.25s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--red)}
@media (max-width:1000px){.auth{grid-template-columns:1fr}.auth aside{display:none}.detail,.reserve{grid-template-columns:1fr}.top{padding:0 16px}.top .user span:first-child{display:none}.page{padding:22px 16px}.filter-inputs{flex-wrap:wrap}.filter-inputs input[type=search]{width:100%}.bar-row{grid-template-columns:1fr 2fr 50px}.bar-row em{display:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>
<script>/*CORE*/</script>
<script>/*APP*/</script>
</body>
</html>
